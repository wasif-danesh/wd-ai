services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: wd, POSTGRES_PASSWORD: wd, POSTGRES_DB: wd }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    profiles: [storage]   # Phase 3; image source to be re-checked (Docker Hub image removed)
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
    volumes: ["./deploy/compose/litellm.yaml:/app/config.yaml:ro"]
    ports: ["4000:4000"]
  api:
    build: { context: ., dockerfile: services/api/Containerfile }
    env_file: .env
    depends_on: [postgres, redis, litellm]
    ports: ["8000:8000"]
  media-worker:
    build: { context: ., dockerfile: services/media-worker/Containerfile }
    env_file: .env
    depends_on: [redis]
  web:
    build: { context: ., dockerfile: apps/web/Containerfile }
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, miniodata: {} }
