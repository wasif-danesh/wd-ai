[project]
name = "wd-ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.380", "httpx>=0.27"]

[tool.uv.workspace]
members = ["services/*", "packages/contracts", "packages/platform-sdk", "products/*"]
exclude = ["products/hello", "products/media-demo"]   # config-only sample products

[tool.uv.sources]
wd-api = { workspace = true }
wd-media-worker = { workspace = true }
wd-contracts = { workspace = true }
wd-platform-sdk = { workspace = true }
wd-music-ai = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
include = ["services", "packages", "products"]
typeCheckingMode = "standard"
# Test helper modules (conftest, fake_comfyui) are imported by name; pytest puts their folders on
# sys.path, so tell pyright too.
extraPaths = ["products/wd-music-ai/tests", "products/wd-image-ai/tests", "products/wd-video-ai/tests", "services/media-worker/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages", "products"]
