[project]
name = "wd-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14", "psycopg[binary]>=3.2",
  "python-json-logger>=2.0", "wd-contracts", "wd-platform-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wd_api"]
