# Sentences for measuring text to speech (ADR-0042). Each language has five everyday sentences with
# a question and a list. `whisper` is the language hint for the round trip; Numbers are left out of the scored sentences because Whisper writes digits ("4.30") where the
# text has words, which counts as an error that is not the voice's; numbers are checked by listening.
# `unit` is how the error is counted (words, or characters for languages written without spaces). Nothing here is user data.
languages:
  en-us: { whisper: en, unit: word, sentences: &en [
    "The weather today is sunny, with a light breeze from the west.",
    "Please call me back tomorrow afternoon, after the meeting.",
    "She bought three books, two notebooks, and a red umbrella.",
    "The train to Edinburgh leaves from the main platform soon.",
    "I can't believe how quickly the year has gone by." ] }
  en-gb: { whisper: en, unit: word, sentences: *en }
  es: { whisper: es, unit: word, sentences: [
    "El tren llega a la estación muy temprano por la mañana.",
    "Mañana vamos a visitar a mis abuelos en el pueblo.",
    "¿Puedes decirme dónde está la biblioteca más cercana?",
    "Compré varios libros, unos cuadernos y un paraguas rojo.",
    "Este año el verano ha sido mucho más caluroso que el anterior." ] }
  fr-fr: { whisper: fr, unit: word, sentences: [
    "Le train pour Lyon part bientôt du quai principal.",
    "Demain nous allons rendre visite à mes grands-parents à la campagne.",
    "Pouvez-vous me dire où se trouve la bibliothèque la plus proche ?",
    "J'ai acheté plusieurs livres, des cahiers et un parapluie rouge.",
    "Cette année, l'été a été beaucoup plus chaud que l'année dernière." ] }
  hi: { whisper: hi, unit: word, sentences: [
    "आज मौसम बहुत सुहावना है और हल्की हवा चल रही है।",
    "कल हम अपने दादा-दादी से मिलने गाँव जाएँगे।",
    "क्या आप मुझे बता सकते हैं कि सबसे नज़दीकी पुस्तकालय कहाँ है?",
    "मैंने कुछ किताबें, कुछ कॉपियाँ और एक लाल छाता खरीदा।",
    "इस साल गर्मी पिछले साल से बहुत ज़्यादा रही है।" ] }
  it: { whisper: it, unit: word, sentences: [
    "Il treno per Roma parte presto dal binario principale.",
    "Domani andiamo a trovare i miei nonni in campagna.",
    "Puoi dirmi dove si trova la biblioteca più vicina?",
    "Ho comprato diversi libri, dei quaderni e un ombrello rosso.",
    "Quest'anno l'estate è stata molto più calda dell'anno scorso." ] }
  ja: { whisper: ja, unit: char, sentences: [
    "今日は天気がよくて、西から軽い風が吹いています。",
    "明日、田舎に住んでいる祖父母に会いに行きます。",
    "いちばん近い図書館はどこか教えていただけますか。",
    "私は本とノートと赤い傘を買いました。",
    "今年の夏は去年よりずっと暑かったです。" ] }
  pt-br: { whisper: pt, unit: word, sentences: [
    "O trem para São Paulo sai cedo da plataforma principal.",
    "Amanhã vamos visitar meus avós no interior.",
    "Você pode me dizer onde fica a biblioteca mais próxima?",
    "Comprei vários livros, alguns cadernos e um guarda-chuva vermelho.",
    "Este ano o verão foi muito mais quente do que o ano passado." ] }
  zh: { whisper: zh, unit: char, sentences: [
    "今天天气很好，西边吹来一阵轻柔的风。",
    "明天我们要去乡下看望我的爷爷奶奶。",
    "请问最近的图书馆在哪里？",
    "我买了几本书、一些笔记本和一把红伞。",
    "今年的夏天比去年热得多。" ] }
