[project]
name = "wd-platform-sdk"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "obstore>=0.11.1",
    "openai>=3.26.0",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wd_platform_sdk"]
