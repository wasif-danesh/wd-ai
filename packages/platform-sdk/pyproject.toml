[project]
name = "wd-platform-sdk"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "langgraph>=1.2.14",
    "obstore>=0.11.1",
    "openai>=3.26.0",
    "pydantic>=2.9",
    "pyyaml>=6",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "wd-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wd_platform_sdk"]

[tool.uv.sources]
wd-contracts = { workspace = true }
