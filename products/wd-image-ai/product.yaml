id: wd-image-ai
capabilities:
  text.moderate:       { provider: litellm, model: moderator }
  text.moderate_image: { provider: litellm, model: multimodal, inputs: [text, image] }
  image.generate:      { provider: comfyui, workflow: flux2-klein-4b, defaults: { width: 1024, height: 1024 } }
  image.edit:          { provider: comfyui, workflow: flux2-klein-4b-edit }
quotas:
  images_per_user_per_day: 20
uploads:
  image: { max_bytes: 10485760 }
