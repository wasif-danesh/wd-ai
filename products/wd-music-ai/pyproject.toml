[project]
name = "wd-music-ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wd-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "sqlalchemy[asyncio]>=2.0"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wd_ai.products"]
wd-music-ai = "wd_music_ai:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wd_music_ai"]
