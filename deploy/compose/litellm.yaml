model_list:
  # Gemma 4 "thinks" by default: reasoning tokens count against max_tokens, double the latency and
  # did not improve lyric quality in our test. Off for creative/chat aliases (ADR-0018).
  - model_name: default-chat
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
  - model_name: lyrics-writer
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
  - model_name: moderator
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: embedder
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  # Backends differ in what they accept (e.g. Ollama rejects `encoding_format`); the gateway drops
  # parameters a backend does not support so callers can use one OpenAI-compatible API.
  drop_params: true
