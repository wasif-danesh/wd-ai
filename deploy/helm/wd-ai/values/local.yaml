# Local kind cluster (make kind-up). Images are built locally and loaded into the node.
image:
  registry: localhost/wd-ai
  tag: dev
  pullPolicy: Never

web:
  service:
    type: NodePort
    nodePort: 30080          # mapped to localhost:3000 by deploy/kind/cluster.yaml

# Use the Ollama already running natively on the Mac. scripts/kind-up.sh sets
# ollama.externalUrl to an address the cluster can reach.
ollama:
  enabled: false

postgres:
  storage: 1Gi
