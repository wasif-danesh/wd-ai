# Base values. Overlay order (later wins):
#   values.yaml  ->  values/<env>.yaml  ->  values/cloud/<cloud>.yaml
# Secrets never live here. They come from the Secret named by `secrets.existingSecret`
# (keys: LITELLM_API_KEY, POSTGRES_PASSWORD, and DATABASE_URL when postgres.enabled=false).

image:
  registry: ghcr.io/wasif-danesh/wd-ai   # <registry>/<api|web|media-worker>:<tag>
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []                        # e.g. [{name: ghcr-pull}] if images are private

secrets:
  existingSecret: wd-ai-secrets

env:
  LOG_LEVEL: INFO
  COMFYUI_BASE_URL: ""                   # Phase 4

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

mediaWorker:
  enabled: true
  replicas: 1
  # stub: placeholder images/audio, no GPU or ComfyUI. real: drive ComfyUI (set comfyui.enabled or
  # env.COMFYUI_BASE_URL). One job at a time per GPU id; workers sharing a GPU share `gpuId`.
  comfyuiMode: stub
  gpuId: gpu0
  jobTimeoutSeconds: 900
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

litellm:
  image: ghcr.io/berriai/litellm:main-stable
  # alias -> backend. `ollama_chat/<model>` and `ollama/<model>` entries also tell the Ollama
  # pod what to pull.
  models:
    # `params` become extra litellm_params. Gemma 4 thinks by default; off for chat and lyrics
    # (ADR-0018). The moderator keeps thinking until a refusal evaluation says otherwise.
    - { alias: default-chat, model: "ollama_chat/gemma4:e4b", params: { think: false } }
    - { alias: lyrics-writer, model: "ollama_chat/gemma4:e4b", params: { think: false } }
    # The moderator keeps thinking on; its accuracy was measured in products/wd-music-ai/evals.
    # A classifier must answer the same way every time, so no sampling randomness (ADR-0022).
    - { alias: moderator, model: "ollama_chat/gemma4:e4b", params: { temperature: 0 } }
    # Image and audio input: same model via Ollama's OpenAI-compatible API (ADR-0020).
    # `backend: ollama-openai` makes the chart point it at Ollama's /v1 and pull the model.
    - { alias: multimodal, model: "openai/gemma4:e4b", backend: ollama-openai, params: { reasoning_effort: none } }
    - { alias: embedder, model: "ollama/nomic-embed-text" }   # 768 dims; see ADR-0017
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

ollama:
  enabled: true
  externalUrl: ""                        # set to use an Ollama outside the cluster
  image: ollama/ollama:latest
  storage: 20Gi
  storageClass: ""
  resources:
    requests: { cpu: "1", memory: 6Gi }
    limits: { memory: 12Gi }
  # GPU: set e.g. { "nvidia.com/gpu": 1 } in a cloud overlay (Phase 4)
  gpuResources: {}
  nodeSelector: {}
  tolerations: []

postgres:
  enabled: true                          # false -> managed DB; provide DATABASE_URL in the Secret
  image: pgvector/pgvector:pg16
  database: wd
  user: wd
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# S3-compatible object storage for generated media (SeaweedFS). Set enabled=false to use an
# external bucket: then provide endpoint, and STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in the Secret.
storage:
  enabled: true
  image: docker.io/chrislusf/seaweedfs:latest   # pin to a version before relying on it
  bucket: wd-ai
  region: us-east-1
  accessKey: wd-ai          # an id, not a secret; the secret key is STORAGE_SECRET_KEY in the Secret
  size: 10Gi
  storageClass: ""
  endpoint: ""              # external endpoint when enabled=false
  publicEndpoint: ""        # URL browsers use for presigned links, if different from the above
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# ComfyUI for real media generation. No image is chosen for you: build or pick one that matches
# your GPU and set `image`. Requires the NVIDIA GPU Operator (see docs/runbooks/homelab-k3s.md).
comfyui:
  enabled: false
  image: ""
  port: 8188
  storage: 40Gi             # models and outputs
  storageClass: ""
  gpuResources: { nvidia.com/gpu: 1 }
  resources:
    requests: { cpu: "1", memory: 8Gi }
    limits: { memory: 24Gi }
  nodeSelector: {}
  tolerations: []

redis:
  enabled: true
  image: redis:7
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
