# Argo CD Application for staging (home lab k3s). Apply once after Argo CD is installed:
#   kubectl apply -f deploy/argocd/application-staging.yaml
# Prerequisite: the Secret `wd-ai-secrets` exists in the `wd-ai` namespace
#   (scripts/k8s-secrets.sh wd-ai). Secrets are never stored in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wd-ai-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wasif-danesh/wd-ai.git
    targetRevision: main
    path: deploy/helm/wd-ai
    helm:
      releaseName: wd-ai
      valueFiles:
        - values/staging.yaml
        - values/cloud/homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wd-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
